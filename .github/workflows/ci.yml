name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  quality:
    name: Install / Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # Build-time env stubs — no real DB needed for a type-check build.
          DATABASE_URL: postgresql://ci:ci@localhost/ci
          MYCASE_DB_URL: postgresql://ci:ci@localhost/ci_mycase
          AUTH_SECRET: ci-test-secret-32-chars-minimum!!
          NEXTAUTH_URL: http://localhost:3000

  e2e:
    name: Playwright Smoke Tests
    runs-on: ubuntu-latest
    # Only run when RUN_E2E repository variable is set to 'true'.
    # Secrets cannot be evaluated in `if` conditions (always empty for security).
    # If E2E_DATABASE_URL or E2E_MYCASE_DB_URL secrets are missing the
    # web server startup will fail with a clear error.
    if: vars.RUN_E2E == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:e2e
        env:
          E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          E2E_MYCASE_DB_URL: ${{ secrets.E2E_MYCASE_DB_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          CHRONICLE_API_URL: ${{ secrets.CHRONICLE_API_URL }}
          CHRONICLE_API_KEY: ${{ secrets.CHRONICLE_API_KEY }}
          N8N_WEBHOOK_SHEETS_SYNC: ${{ secrets.N8N_WEBHOOK_SHEETS_SYNC }}
          N8N_WEBHOOK_MYCASE_DOCS: ${{ secrets.N8N_WEBHOOK_MYCASE_DOCS }}
          E2E_MEMBER_EMAIL: ${{ secrets.E2E_MEMBER_EMAIL }}
          E2E_MEMBER_PASSWORD: ${{ secrets.E2E_MEMBER_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
